steps:
  - label: ":python: Generate sentence"
    key: "generate-sentence"
    command: |
      pip install .
      python -c "import loremipsum; print(loremipsum.sentence(max_char=20))" > result.txt
      cat result.txt
    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
    agents:
      queue: "self-hosted"
   
  - label: ":memo: Annotate sentence"
    depends_on: "generate-sentence"
    commands: |
      buildkite-agent annotate "$(cat result.txt)" --style "info" --context "sentence-result"
    agents:
      queue: "self-hosted" 
