steps:
  - label: ":python: Generate sentence"
    command: |
      pip install .
      python -c "import loremipsum; print(loremipsum.sentence(max_char=20))" > result.txt
      cat result.txt
      buildkite-agent annotate "$(cat result.txt)" --style "info"
    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
          mount-buildkite-agent: true
    agents:
      queue: "self-hosted"
    
