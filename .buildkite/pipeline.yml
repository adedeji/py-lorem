steps:
  - label: ":python: Generate sentence"
    key: "generate-sentence"
    command: |
      pip install .
      python -c "import loremipsum; print(loremipsum.sentence(max_char=20))" > result.txt
      cat result.txt
    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
    artifact_paths:
      - "result.txt"
    agents:
      queue: "self-hosted"
   
  - label: ":memo: Annotate sentence"
    depends_on: "generate-sentence"
    commands: |
      buildkite-agent artifact download "result.txt" .
      buildkite-agent annotate "$(cat result.txt)" --style "info" --context "sentence-result"
    agents:
      queue: "self-hosted"

  - label: ":python: Generate paragraph"
    key: "generate-paragraph"
    command: |
      pip install .
      python -c "import loremipsum; print(loremipsum.paragraph(max_char=100))" > result2.txt
      cat result2.txt
    plugins:
      - docker#v5.13.0:
          image: "python:3.13"
    artifact_paths:
      - "result2.txt"
    agents:
      queue: "self-hosted"
  
  - label: ":memo: Annotate paragraph"
    depends_on: "generate-paragraph"
    commands: |
      buildkite-agent artifact download "result2.txt" .
      buildkite-agent annotate "$(cat result2.txt)" --style "info" --context "paragraph-result"
    agents:
      queue: "self-hosted" 